unbind C-b
set -g prefix C-a
bind a send-prefix
bind e setw synchronize-panes
set -as terminal-features ',xterm-256color:clipboard'


set-option -g mouse on
set-option -g history-limit 30000
set-option -g allow-rename off
set -g display-time 4000
set -g display-panes-time 4000
setw -g monitor-activity on
set -g visual-activity off
bind R source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

set-window-option -g mode-keys vi 
set-window-option -g pane-base-index 1

set -g status-style bg=colour202,fg=BrightWhite
set -g status-left '[#S] '
set -g window-status-current-format ' ⎣#[bold]#I: #W#[default]⎦ '
set -g status-right ' %A, %b %d %H:%M '

set -g base-index 1

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T root S-Enter send-keys C-j

bind -r C-o select-pane -t :.+
bind -r C-i select-pane -t :.-

bind-key -n M-n new-window
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9


if-shell "uname | grep -q Linux" "set-option -g default-terminal 'tmux-256color'; bind-key -T copy-mode-vi y send-keys copy-pipe 'xclip -in -selection clipboard'"

# clipboard integration
if-shell "uname | grep -q Darwin" \
  "set -s copy-command 'pbcopy'" \
  "set -s copy-command 'xclip -selection clipboard'"

# clear pane contents
bind-key k send-keys -R C-l \; clear-history
# copy complete pane contents
bind-key C-y run-shell "tmux capture-pane -p -S - | \$(tmux show-options -sv copy-command)"
# pick from a list of predefined commands (used for common operations on ephemeral hosts)
bind-key C-c display-popup -E 'cmd=$(fzf < ~/.config/tmux/commands.txt); [ -n "$cmd" ] && tmux send-keys -t "${pane_id}" "$cmd" Enter'

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
# prefix + I       - install plugins
# prefix + u       - update plugins
# prefix + alt + u - remove plugins which are not on the list

# TPM plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

# continuum auto-restore
set -g @continuum-restore 'on'

# Install TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
